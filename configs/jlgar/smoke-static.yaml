admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: jlgar_smoke_http
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 80
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: jlgar_smoke_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          route_config:
            name: jlgar_smoke_routes
            virtual_hosts:
            - name: jlgar_smoke_vhost
              domains:
              - "*"
              routes:
              - match:
                  path: /healthz
                direct_response:
                  status: 200
                  body:
                    inline_string: "ok\n"
              - match:
                  prefix: /
                direct_response:
                  status: 200
                  body:
                    inline_string: "jlgar custom Envoy smoke test\n"
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
